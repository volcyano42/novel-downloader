# ═══════════════════════════════════════════════════════════════
#  novel-downloader CI
#  每次 push / PR 到 main / dev 时运行：
#    test        —— 语法检查 + 导入验证 + 单元测试（3.10 / 3.11 / 3.12）
#    lint        —— ruff（规则见 pyproject.toml 的 [tool.ruff]）
#    wheel-smoke —— 构建 wheel 并从仓库外安装，校验书源清单真的进了包
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 语法检查
        run: python -m compileall -q . -x 'app_data|\.git'

      - name: 模块导入检查
        run: python tests/check_imports.py

      - name: 运行测试
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        # private 读 pyproject.toml 的 [tool.ruff]；public 无该文件（清单规定不迁移），
        # 此处显式给出同一套规则口径，保证两仓 lint 结果一致
        run: |
          if [ -f pyproject.toml ]; then
            ruff check novelbase
          else
            ruff check --select E4,E7,E9,F,W,I,B,UP --line-length 100 novelbase
          fi

  wheel-smoke:
    name: wheel 安装验证（书源清单）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        # 需要 pyproject.toml：public 无该文件（清单规定不迁移），这两步自动跳过。
        # ⚠️ hashFiles 只能用在 step 级 if —— 放在 job 级会让整个 workflow 解析失败
        # （表现为 Actions 列表里该 workflow 的 name 显示成文件路径，run 无 job 直接失败）。
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: 安装 wheel 并从仓库外校验书源清单
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "
          import sys
          from pathlib import Path
          import novelbase, novelbase.sources as _pkg
          from novelbase.sources.manifest import scan_source_names
          assert not novelbase.__file__.startswith(sys.argv[1]), novelbase.__file__
          from novelbase import list_sources
          expected = len(scan_source_names([Path(_pkg.__file__).resolve().parent]))
          sources = list_sources()
          assert len(sources) == expected, f'wheel 缺书源清单（source.json 未打包）: {sources}'
          print(f'wheel 内书源 {len(sources)}/{expected}:', sources)
          " "$GITHUB_WORKSPACE"
