# ═══════════════════════════════════════════════════════════════
#  novel-downloader CI
#  每次 push / PR 到 main / dev 时运行：
#    test        —— 语法检查 + 导入验证 + 单元测试（3.10 / 3.11 / 3.12）
#    lint        —— ruff（规则见 pyproject.toml 的 [tool.ruff]）
#    wheel-smoke —— 构建 wheel 并从仓库外安装，校验书源清单真的进了包
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 语法检查
        run: python -m compileall -q . -x 'app_data|\.git'

      - name: 模块导入检查
        run: python tests/check_imports.py

      - name: 运行测试
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check novelbase

  wheel-smoke:
    name: wheel 安装验证（书源清单）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: 安装 wheel 并从仓库外校验书源清单
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "
          import sys, novelbase
          assert not novelbase.__file__.startswith(sys.argv[1]), novelbase.__file__
          from novelbase import list_sources
          sources = list_sources()
          assert len(sources) == 10, f'wheel 缺书源清单（source.json 未打包）: {sources}'
          print('wheel 内书源:', sources)
          " "$GITHUB_WORKSPACE"
