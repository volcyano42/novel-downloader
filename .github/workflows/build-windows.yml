name: Build Windows x64 portable

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
# 方案：build-portable.ps1（Embedded Python + 源码 + 依赖 zip，与 Linux portable 一致，免 C 编译）
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          $m = [regex]::Match($content, 'version = "([^"]+)"')
          if (-not $m.Success) { Write-Error "无法从 pyproject.toml 获取版本号"; exit 1 }
          $VERSION = $m.Groups[1].Value
          Write-Output "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $VERSION"

      - name: Build (引用 build-portable.ps1)
        timeout-minutes: 90
        run: powershell -ExecutionPolicy Bypass -File ./build-portable.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 校验产物
        shell: pwsh
        run: |
          $dst = "dist\novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64.zip"
          Write-Host "dist 内容:"
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          if (-not (Test-Path $dst)) { Write-Error "未找到产物: $dst"; exit 1 }
          Write-Host "OK: $dst"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error
