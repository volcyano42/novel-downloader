name: Build Windows x64

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Windows x64 exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka

      - name: Cache Nuitka + pip
        uses: actions/cache@v4
        with:
          path: |
            .nuitka-cache
            ~/AppData/Local/pip/cache
          key: nuitka-win-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.tsx', '**/*.ts') }}
          restore-keys: |
            nuitka-win-${{ runner.os }}-

      - name: Build (引用 build-web.ps1)
        timeout-minutes: 110
        run: powershell -ExecutionPolicy Bypass -File ./build-web.ps1

      - name: 读取版本号并重命名
        id: ver
        shell: pwsh
        run: |
          $VERSION = python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))"
          Write-Output "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "dist 内容:"
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          $src = "dist\novel-downloader-web.exe"
          $dst = "dist\novel-downloader-web-windows-x64-$VERSION.exe"
          if (-not (Test-Path $src)) { Write-Error "未找到产物: $src"; exit 1 }
          for ($i = 1; $i -le 5; $i++) {
            try { Copy-Item $src $dst -Force -ErrorAction Stop; break }
            catch { Write-Host "复制被锁定（第 $i 次），等待 10s..."; Start-Sleep 10 }
          }
          if (-not (Test-Path $dst)) { Write-Error "重命名最终失败"; Get-ChildItem dist | Format-Table Name, Length -AutoSize; exit 1 }
          Write-Host "OK: $dst"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-windows-x64-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-windows-x64-${{ steps.ver.outputs.version }}.exe
