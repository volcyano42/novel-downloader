name: Build Windows x64 (portable + Nuitka)

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
# - portable: build-portable.ps1（Embedded Python + 源码 + 依赖 zip，免 C 编译）
# - nuitka:   build-nuitka.ps1（Nuitka 4.1.3 onefile 编译，仅 workflow_dispatch 手动触发）
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          $m = [regex]::Match($content, 'version = "([^"]+)"')
          if (-not $m.Success) { Write-Error "无法从 pyproject.toml 获取版本号"; exit 1 }
          $VERSION = $m.Groups[1].Value
          Write-Output "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $VERSION"

      - name: Build (引用 build-portable.ps1)
        timeout-minutes: 90
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build-portable.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 校验产物
        shell: pwsh
        run: |
          $dst = "dist\novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64.zip"
          Write-Host "dist 内容:"
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          if (-not (Test-Path $dst)) { Write-Error "未找到产物: $dst"; exit 1 }
          Write-Host "OK: $dst"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/novel-downloader-web-portable-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 3

  build-nuitka:
    name: Windows x64 Nuitka onefile
    runs-on: windows-latest
    # 仅手动触发（不随 workflow_call 自动跑，避免 build-dist.yml 超时）
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          $m = [regex]::Match($content, 'version = "([^"]+)"')
          if (-not $m.Success) { Write-Error "无法从 pyproject.toml 获取版本号"; exit 1 }
          $VERSION = $m.Groups[1].Value
          Write-Output "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $VERSION"

      - name: 安装依赖（供 Nuitka 静态分析）
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Build Nuitka
        timeout-minutes: 120
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build-nuitka.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "dist\novel-downloader-web-${{ steps.ver.outputs.version }}.exe"
          Write-Host "dist 内容:"
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          if (-not (Test-Path $exe)) { Write-Error "未找到产物: $exe"; exit 1 }
          Write-Host "OK: $exe"

      - name: Defender 扫描
        shell: pwsh
        run: |
          $exe = "dist\novel-downloader-web-${{ steps.ver.outputs.version }}.exe"
          $defender = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          if (Test-Path $defender) {
            Write-Host "Running Defender scan on $exe ..."
            & $defender -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Defender scan exited with code $LASTEXITCODE (可能被拦截)"
            } else {
              Write-Host "Defender scan: clean"
            }
          } else {
            Write-Host "Defender 未安装或路径不可用，跳过扫描"
          }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-${{ steps.ver.outputs.version }}-windows-x64-exe
          path: dist/novel-downloader-web-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 3
