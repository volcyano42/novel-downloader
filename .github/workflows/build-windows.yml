name: Build Windows x64

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Windows x64 exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.ps1)
        run: powershell -ExecutionPolicy Bypass -File ./build-web.ps1

      - name: 读取版本号并重命名
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web.exe "dist/novel-downloader-web-windows-x64-$VERSION.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-windows-x64-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-windows-x64-${{ steps.ver.outputs.version }}.exe
