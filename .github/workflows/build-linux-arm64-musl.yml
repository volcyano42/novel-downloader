name: Build Linux arm64 (musl)

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
# 方案 A：alpine (musl) 环境 + Nuitka --musl + --static-libpython
# → 完全静态二进制，Termux（bionic libc）可直接运行
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux-arm64-musl:
    name: Linux arm64 musl (Termux)
    runs-on: ubuntu-22.04-arm   # 原生 arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # alpine 内无现代 node → 先在 host 构建前端，alpine 里跳过前端
      - name: Build frontend (host)
        run: |
          cd services/frontend
          npm ci
          npm run build

      - name: Build in alpine docker (musl, 引用 build-web.sh --musl)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            --platform linux/arm64 alpine:3.20 sh -c "
              set -e
              # python3-dev 提供头文件；alpine 无 libpython 静态库，Nuitka --static-libpython 会自动从源码编译
              apk add --no-cache bash python3 python3-dev py3-pip gcc musl-dev make patchelf \
                libheif-dev zlib-dev libjpeg-turbo-dev libffi-dev openssl-dev
              # alpine 自带 patchelf 0.18.0 被 Nuitka 判为 buggy，用 PyPI musllinux wheel 0.17.2.4 覆盖
              pip3 install --break-system-packages patchelf==0.17.2.4
              patchelf --version
              pip3 install --break-system-packages -r requirements.txt nuitka
              chmod +x build-web.sh
              ./build-web.sh --musl --skip-frontend
              # 容器内 root 创建的 dist/ 属主是 root，host runner 无写权限，放开权限供后续 mv
              chmod -R a+rwX /src/dist
            "

      - name: 读取版本号并重命名
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web "dist/novel-downloader-web-linux-arm64-musl-$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-arm64-musl-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-linux-arm64-musl-${{ steps.ver.outputs.version }}
