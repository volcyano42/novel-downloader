name: Build Linux arm64 Termux portable

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
# 方案：build-portable.sh（Termux 用内置 Python pyroot/（PYTHONHOME 重定位）或 pkg python；依赖预装，用户开箱即用）
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux-arm64-termux-portable:
    name: Linux arm64 Termux portable
    runs-on: ubuntu-22.04-arm   # 原生 arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 在 termux-docker 容器预装 Python 依赖（bionic 环境，与真机 Termux 一致），
      # 导出 site-packages (deps/) 与 Python 本体+依赖库 (pyroot/)
      - name: 预装依赖 (termux-docker)
        run: |
          chmod -R a+rwX "${{ github.workspace }}"
          docker pull termux/termux-docker:aarch64 || true
          # 容器层重试：整个预装流程重试 3 次（每次全新容器，规避 pkg 网络/资源偶发失败）
          for attempt in 1 2 3; do
            echo "=== 预装尝试 $attempt/3 ==="
            if docker run --rm \
              -v "${{ github.workspace }}":/src -w /src \
              --security-opt seccomp:unconfined \
              termux/termux-docker:aarch64 bash -c '
                set -e
                pkg set-mirror https://packages-cf.termux.dev/apt/termux-main >/dev/null 2>&1 || true
                # pkg update/install 带重试（CI 并发/网络波动偶发失败），输出保留便于排障
                for u in 1 2 3; do
                  pkg update -y && break
                  echo "pkg update 第 $u 次失败，重试..." && sleep 15
                done
                for i in 1 2 3 4 5; do
                  if pkg install -y python rust clang binutils patchelf \
                    libheif libjpeg-turbo zlib libffi openssl libyaml \
                    python-pillow python-lxml; then
                    break
                  fi
                  echo "pkg install 第 $i 次失败，重试..."
                  sleep 20
                done
                export ANDROID_API_LEVEL=24
                # Termux 排除 browser 模式依赖（psutil 不支持 Android）；容器无 /tmp，用挂载卷
                # 另：Termux(bionic) 编不了 uvloop（要 libuv 的 ./configure，容器无 autotools）
                # → 去掉 uvicorn[standard] 的 C/Rust extras，只装纯 Python 的 uvicorn
                #   （与 APK 的 build-apk.sh、pydantic<2 同一条思路）
                # ！这里必须用双引号：整个脚本外层是 bash -c '...'，
                #   内层再用单引号会提前终止外层字符串，导致 \[ 的反斜杠被 shell 吃掉，
                #   sed 收到 [standard] 字符类 → 匹配不到 uvicorn[standard]（2026-09-27 踩到）
                grep -v "^playwright" /src/requirements.txt \
                  | sed "s/^uvicorn\[standard\]/uvicorn/" > /src/.req-termux.txt
                # 自检：替换若未生效就立刻失败，别等 uvloop 编译十几分钟才暴露
                echo "--- .req-termux.txt 的 uvicorn 行 ---"
                grep -n "uvicorn" /src/.req-termux.txt || true
                if grep -q "uvloop\|\[standard\]" /src/.req-termux.txt; then
                  echo "::error::requirements 仍含 uvicorn 的 extras（uvloop 在 Termux/bionic 编不过）"
                  exit 1
                fi
                pip install --break-system-packages -r /src/.req-termux.txt
                # 导出依赖 site-packages
                mkdir -p /src/deps
                cp -r "$PREFIX"/lib/python*/site-packages/. /src/deps/
              # 导出 Python 本体（bin + 标准库 + 依赖 .so，供 PYTHONHOME 重定位）
              mkdir -p /src/pyroot/bin /src/pyroot/lib
              cp "$PREFIX"/bin/python* /src/pyroot/bin/ 2>/dev/null || true
              cp -r "$PREFIX"/lib/python*/ /src/pyroot/lib/ 2>/dev/null || true
              cp "$PREFIX"/lib/libpython* /src/pyroot/lib/ 2>/dev/null || true
              # python 运行依赖的其他 .so（libssl/libffi/libz 等，Android linker 需要）
              cp "$PREFIX"/lib/lib*.so* /src/pyroot/lib/ 2>/dev/null || true
              chmod -R a+rwX /src/deps /src/pyroot
              echo "预装完成: deps $(ls /src/deps | wc -l) 项, pyroot $(du -sh /src/pyroot | cut -f1)"
            '; then
              echo "预装成功（第 $attempt 次）"
              break
            else
              echo "预装第 $attempt 次失败，重试..."
              sleep 15
            fi
          done
          # 快速失败：预装必须真的产出 deps/ 与 pyroot/bin/python，否则会拖到打包阶段
          # （打出 1MB 空壳）与验证阶段才暴露，掩盖真正的根因
          test -n "$(ls -A deps 2>/dev/null)" || { echo "::error::deps/ 为空 → 预装失败"; exit 1; }
          ls pyroot/bin/python* >/dev/null 2>&1 || { echo "::error::pyroot/bin/python 缺失 → 预装失败"; exit 1; }

      - name: Build portable (引用 build-portable.sh)
        run: |
          chmod +x scripts/build-portable.sh
          ./scripts/build-portable.sh --platform termux --version ${{ steps.ver.outputs.version }} --deps-dir deps --pyroot-dir pyroot

      # CI 内实测：用内置 Python (PYTHONHOME) 启动服务，验证开箱即用
      - name: 验证 PYTHONHOME 启动
        run: |
          # runner 创建的 dist 目录容器用户无写权限，先放开（pyroot 属主为容器 root，runner 无法 chmod，忽略失败——容器内 root 有全部权限）
          chmod -R a+rwX "${{ github.workspace }}" 2>/dev/null || true
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            --security-opt seccomp:unconfined \
            termux/termux-docker:aarch64 bash -c '
              set -e
              cd /src/dist/portable
              export PYTHONHOME="$PWD/pyroot"
              export LD_LIBRARY_PATH="$PWD/pyroot/lib"
              export PATH="$PWD/pyroot/bin:$PATH"
              export PYTHONPATH="$PWD/python-deps"
              echo "=== python --version ==="
              python --version 2>&1 || true
              echo "=== 启动 uvicorn ==="
              python -m uvicorn services.backend.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
              SERVER_PID=$!
              CODE="000"
              for i in $(seq 1 20); do
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://127.0.0.1:8000 2>/dev/null || echo 000)
                  if [ "$CODE" = "200" ]; then break; fi
                  sleep 3
              done
              echo "=== PYTHONHOME 验证 HTTP: $CODE ==="
              curl -s http://127.0.0.1:8000 | head -c 80
              echo ""
              curl -s http://127.0.0.1:8000/api/v2/novels | head -c 80
              echo ""
              head -8 server.log 2>/dev/null || echo "无 server.log"
              [ "$CODE" = "200" ] || { echo "启动验证失败"; exit 1; }
              kill $SERVER_PID 2>/dev/null || true
            '

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-portable-${{ steps.ver.outputs.version }}-termux
          path: dist/novel-downloader-web-portable-${{ steps.ver.outputs.version }}-termux.tar.gz
          if-no-files-found: error
          retention-days: 3
