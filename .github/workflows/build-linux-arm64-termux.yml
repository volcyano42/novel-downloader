name: Build Linux arm64 Termux

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
# 用 termux/termux-docker（bionic libc）构建 → 产物真机 Termux 可直接运行
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux-arm64-termux:
    name: Linux arm64 Termux
    runs-on: ubuntu-22.04-arm   # 原生 arm64 runner（无需 QEMU）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Termux 容器内无现代 node → 先在 host 构建前端，容器里跳过
      - name: Build frontend (host)
        run: |
          cd services/frontend
          npm ci
          npm run build

      - name: Build in termux-docker (bionic, 引用 build-termux.sh)
        run: |
          # 清理可能残留的构建锁（host 挂载目录被上一轮 docker 容器遗留）
          rm -rf .build.lock
          # 确保镜像存在（arm64 runner 原生拉取）
          docker pull termux/termux-docker:aarch64 || true
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            --security-opt seccomp:unconfined \
            termux/termux-docker:aarch64 bash /src/build-termux.sh --skip-frontend

      - name: 读取版本号并重命名
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web "dist/novel-downloader-web-linux-arm64-termux-$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-arm64-termux-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-linux-arm64-termux-${{ steps.ver.outputs.version }}
