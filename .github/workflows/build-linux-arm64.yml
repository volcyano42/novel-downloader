name: Build Linux arm64

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-22.04-arm   # 原生 arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libheif-dev: pillow-heif 无 arm64 预编译 wheel，需源码编译
          sudo apt-get install -y patchelf libheif-dev
          pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.sh)
        run: |
          chmod +x build-web.sh
          ./build-web.sh

      - name: 读取版本号并重命名
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web "dist/novel-downloader-web-linux-arm64-$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-arm64-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-linux-arm64-${{ steps.ver.outputs.version }}
