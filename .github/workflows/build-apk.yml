name: Build Android APK

# 手动触发或作为可复用 workflow 被 build-dist.yml 调用
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Build APK (引用 build-android.sh，KS_PASS 非交互签名)
        env:
          KS_PASS: novel-downloader-ci
        run: |
          chmod +x build-android.sh
          ./build-android.sh --sign --key-alias novel-downloader

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-apk-${{ steps.ver.outputs.version }}
          path: android/dist/*.apk
