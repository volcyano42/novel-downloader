name: Build Android APK

on:
  push:
    branches: [dev]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Notify WeChat
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          APK_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            CONTENT="✅ 小说下载器 Android APK 编译成功！\n点击查看: $APK_URL"
          else
            CONTENT="❌ 小说下载器 Android APK 编译失败\n查看详情: $APK_URL"
          fi
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$CONTENT\"}}"
          fi
