name: Build Distributables

# 手动触发：构建发行产物
#   - novel-downloader-web.exe      Windows x64（Nuitka 打包，引用 build-web.ps1）
#   - novel-downloader-web          Linux x64（Nuitka 打包，引用 build-web.sh）
#   - novel-downloader-web          Linux arm64（Nuitka 打包，引用 build-web.sh，供 Termux/arm64 环境）
#   - novel-downloader-v1.0.0.apk   Android arm64-v8a（引用 build-android.sh，KS_PASS 非交互签名）
on:
  workflow_dispatch:

jobs:
  # ═══════════════ Windows x64 exe ═══════════════
  build-windows:
    name: Windows x64 exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.ps1)
        run: powershell -ExecutionPolicy Bypass -File ./build-web.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-windows-x64
          path: dist/novel-downloader-web.exe

  # ═══════════════ Linux x64 ═══════════════
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-22.04   # glibc 2.35，比 24.04 兼容更多旧发行版
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.sh)
        run: |
          chmod +x build-web.sh
          ./build-web.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-x64
          path: dist/novel-downloader-web

  # ═══════════════ Linux arm64（Termux） ═══════════════
  build-linux-arm64:
    name: Linux arm64 (Termux)
    runs-on: ubuntu-22.04-arm   # glibc 2.35，原生 arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libheif-dev: pillow-heif 无 arm64 预编译 wheel，需源码编译
          sudo apt-get install -y patchelf libheif-dev
          pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.sh)
        run: |
          chmod +x build-web.sh
          ./build-web.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-arm64
          path: dist/novel-downloader-web

  # ═══════════════ Android APK arm64-v8a ═══════════════
  build-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Build APK (引用 build-android.sh，KS_PASS 非交互签名)
        env:
          KS_PASS: novel-downloader-ci
        run: |
          chmod +x build-android.sh
          ./build-android.sh --sign --key-alias novel-downloader

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-apk-arm64
          path: android/dist/*.apk
