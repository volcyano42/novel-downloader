name: Build Distributables

# 手动触发：构建发行产物
#   - novel-downloader-web.exe      Windows x64 / x86（Nuitka 打包，引用 build-web.ps1）
#   - novel-downloader-web          Linux x64 / arm64 / x86（Nuitka 打包，引用 build-web.sh）
#   - novel-downloader-v1.0.0.apk   Android universal APK（引用 build-android.sh，KS_PASS 非交互签名）
on:
  workflow_dispatch:

jobs:
  # ═══════════════ Windows x64 / x86 exe ═══════════════
  build-windows:
    name: Windows ${{ matrix.arch }} exe
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.ps1)
        run: powershell -ExecutionPolicy Bypass -File ./build-web.ps1

      - name: 读取版本号并重命名
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web.exe "dist/novel-downloader-web-windows-${{ matrix.arch }}-$VERSION.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-windows-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-windows-${{ matrix.arch }}-${{ steps.ver.outputs.version }}.exe

  # ═══════════════ Linux x64 / arm64 ═══════════════
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04   # glibc 2.35，比 24.04 兼容更多旧发行版
          - arch: arm64
            runner: ubuntu-22.04-arm   # 原生 arm64 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libheif-dev: pillow-heif 无 arm64 预编译 wheel，需源码编译
          sudo apt-get install -y patchelf libheif-dev
          pip install -r requirements.txt nuitka

      - name: Build (引用 build-web.sh)
        run: |
          chmod +x build-web.sh
          ./build-web.sh

      - name: 读取版本号并重命名
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web "dist/novel-downloader-web-linux-${{ matrix.arch }}-$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-linux-${{ matrix.arch }}-${{ steps.ver.outputs.version }}

  # ═══════════════ Linux x86 (i386) ═══════════════
  build-linux-x86:
    name: Linux x86 (i386)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # i386 docker 内无现代 node → 先在 host 构建前端，docker 里跳过前端
      - name: Build frontend (host)
        run: |
          cd services/frontend
          npm ci
          npm run build

      - name: Build in i386 docker (引用 build-web.sh --skip-frontend)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            i386/ubuntu:22.04 bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y python3 python3-dev python3-pip gcc patchelf \
                libheif-dev libjpeg-dev zlib1g-dev libffi-dev libssl-dev pkg-config
              pip3 install -r requirements.txt nuitka
              chmod +x build-web.sh
              ./build-web.sh --skip-frontend
            "

      - name: 读取版本号并重命名
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist/novel-downloader-web "dist/novel-downloader-web-linux-x86-$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-web-linux-x86-${{ steps.ver.outputs.version }}
          path: dist/novel-downloader-web-linux-x86-${{ steps.ver.outputs.version }}

  # ═══════════════ Android universal APK ═══════════════
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Build APK (引用 build-android.sh，KS_PASS 非交互签名)
        env:
          KS_PASS: novel-downloader-ci
        run: |
          chmod +x build-android.sh
          ./build-android.sh --sign --key-alias novel-downloader

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-downloader-apk-${{ steps.ver.outputs.version }}
          path: android/dist/*.apk
