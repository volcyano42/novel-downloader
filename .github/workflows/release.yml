      - name: 触发 build-dist 并等待完成
        id: trigger
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo
            // 记录触发前 build-dist 最新 run
            const before = (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'build-dist.yml', per_page: 1
            })).data.workflow_runs[0]?.id || 0
            // 触发构建
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'build-dist.yml', ref: 'dev'
            })
            core.info(`已触发 build-dist.yml（触发前最新 run: ${before}）`)
            // 轮询直到出现本次触发产生的新 completed run（id > before；每 15s 一次，最多 60 分钟）
            let runId = null, conclusion = null
            for (let i = 0; i < 240; i++) {
              await new Promise(r => setTimeout(r, 15000))
              const runs = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build-dist.yml', per_page: 5
              })).data.workflow_runs
              // 只认 id > before 的 run（本次触发产生的），避免匹配更早的旧 run
              const run = runs.find(r => r.id > before && r.status === 'completed')
              if (run) { runId = run.id; conclusion = run.conclusion; break }
            }
            if (!runId) throw new Error('等待 build-dist 完成超时（60 分钟）')
            if (conclusion !== 'success') throw new Error(`build-dist 构建失败（conclusion=${conclusion}）`)
            core.setOutput('run_id', String(runId))
