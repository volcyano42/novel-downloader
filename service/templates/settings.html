<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 - novel-downloader</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
a { color: var(--accent); }
.flash { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
.flash.success { background: #1a3a1a; color: var(--success); border: 1px solid var(--success); }
.flash.error { background: #3a1a1a; color: var(--danger); border: 1px solid var(--danger); }
</style>
</head>
<body>

<h1>⚙️ 设置</h1>
<div class="status-bar"><a href="/">← 返回主页</a></div>

{% if flash %}
<div class="flash {{ flash.type }}">{{ flash.text }}</div>
{% endif %}

<!-- 基本配置 -->
<div class="card">
  <h2>基本配置</h2>
  <form method="POST" action="/settings/save">
    <div class="form-group">
      <label>运行模式</label>
      <select name="mode">
        <option value="browser" {% if mode == 'browser' %}selected{% endif %}>Browser (浏览器)</option>
        <option value="requests" {% if mode == 'requests' %}selected{% endif %}>Requests (HTTP)</option>
        <option value="api" {% if mode == 'api' %}selected{% endif %}>API (oiapi)</option>
      </select>
    </div>
    <div class="form-group">
      <label>默认分组</label>
      <input name="group" value="{{ group }}">
    </div>
    <div class="form-group">
      <label>最大并发数</label>
      <input name="max_workers" type="number" value="{{ max_workers }}">
    </div>
    <button type="submit" class="btn-success">保存基本配置</button>
  </form>
</div>

<!-- 站点配置 -->
<div class="card">
  <h2>🌐 站点配置</h2>
  <div class="form-group">
    <label>当前平台</label>
    <form method="POST" action="/settings/save_site" id="site-switch-form">
      <select name="site_platform" onchange="this.form.submit()">
        {% for name, label in platforms.items() %}
        <option value="{{ name }}" {% if name == platform %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
  <div class="mt-8">
    <a href="/settings/site/{{ platform }}">编辑 {{ platform_labels.get(platform, platform) }} 站点配置 →</a>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
