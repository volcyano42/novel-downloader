[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelbase"
version = "4.5.0"
description = "多平台小说下载器核心库"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "novel-downloader contributors" }]

dependencies = [
    "beautifulsoup4",
    "lxml",
    "chardet",
    "playwright",
    "fastapi",
    "httpx",
    "Pillow",
    "pillow-heif",
    "python-box",
    "PyYAML",
    "rich",
    "uvicorn",
    "yarl",
]

[tool.setuptools.packages.find]
include = ["novelbase*"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.novel-downloader.migration]
# 非迁移文件清单（public 迁移排除项）——check_public.py 的唯一数据源
# 与 PUBLIC_MANIFEST.md「白名单内排除」保持一致；两处修改需同步
exclude = [
    "novelbase/sources/qidian/**",
    "novelbase/sources/qimao/**",
    "novelbase/sources/92xs/**",
    "novelbase/sources/fanqie/api/rain/**",
    "novelbase/utils/_manifest.py",
    "frontend/node_modules/**",
    "frontend/dist/**",
    "android/.gradle/**",
    "android/app/build/**",
    "android/local.properties",
    "android/keystore.properties",
    "android/*.jks",
    "docs/superpowers/**",
    "docs/session-prompt.md",
    "docs/learning/**",
    # 依赖未公开书源的测试（public 无 qidian/qimao/92xs/fanqie-rain）
    "tests/test_source_async.py",
    "tests/test_source_contracts.py",
    "tests/test_browser_sources.py",
    "**/__pycache__/**",
    "**/*.pyc",
]