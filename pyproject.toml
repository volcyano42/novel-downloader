[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelbase"
version = "4.2.3-dev"
description = "多平台小说下载器核心库"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "novel-downloader contributors" }]

dependencies = [
    "beautifulsoup4",
    "drissionpage",
    "fastapi",
    "Pillow",
    "pillow-heif",
    "python-box",
    "PyYAML",
    "Requests",
    "rich",
    "urllib3",
    "uvicorn",
    "yarl",
]

[tool.setuptools.packages.find]
include = ["novelbase*"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "httpx",
]
