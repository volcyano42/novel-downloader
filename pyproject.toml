[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelbase"
version = "4.5.2"
description = "多平台小说下载器核心库"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "novel-downloader contributors" }]

dependencies = [
    # 与仓库根 requirements.txt 同一套版本策略（下界=已验证版本；上界仅用于已知破坏性变更）。
    # 差异：这里用 uvicorn（库依赖不拉 [standard] 的 httptools/uvloop/watchfiles/python-dotenv）。
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.0.2,<7",
    "chardet>=7.1,<8",
    "playwright>=1.63,<2",
    "fastapi>=0.142,<1",
    "starlette>=1.0.1,<2",
    "httpx>=0.28.1,<1",
    "Pillow>=12.3,<13",
    "pillow-heif>=1.3,<2",
    "python-box>=7.4,<8",
    "PyYAML>=6.0.3,<7",
    "rich>=15,<16",
    "uvicorn>=0.54,<1",
]

[tool.setuptools.packages.find]
include = ["novelbase*"]

[tool.setuptools.package-data]
# 书源清单是包内唯一的非 .py 数据文件，不声明就不会进 wheel/sdist：
# 实测 `pip install .` 装出来的包缺它 → scan_source_names() 静默返回 {} → list_sources() 为空。
# 键只能是包名（pyproject 的 schema 不接受 `novelbase.sources.*` 这类 glob 键）。
"novelbase.sources" = ["*/source.json"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.novel-downloader.migration]
# 非迁移文件清单（public 迁移排除项）——check_public.py 的唯一数据源
# 与 PUBLIC_MANIFEST.md「白名单内排除」保持一致；两处修改需同步
exclude = [
    # 未公开书源：扁平化后书源是一层目录（2026-09-30 修正旧的四层路径）。
    # 旧路径（如 `qidian/**`）在 check_public.py 的 fnmatch 下匹配不到任何文件，
    # 会让这些源被判成「白名单必需内容」——闸门反而报「缺失」指挥你补进 public。
    "novelbase/sources/qidian_requests_default/**",
    "novelbase/sources/qidian_browser_default/**",
    "novelbase/sources/qimao_requests_default/**",
    "novelbase/sources/qimao_browser_default/**",
    "novelbase/sources/qimao_api_rain/**",
    "novelbase/sources/92xs_requests_default/**",
    "novelbase/sources/fanqie_api_rain/**",
    # fanqie_api_oiapi 2026-10-14 移出排除：它是公开第三方服务（https://oiapi.net/api/FqRead）的
    # 封装，key 由用户在 sources/*.yaml 自备（仓库内为空占位），非逆向/破解实现 —— 用户决定公开
    "novelbase/utils/_manifest.py",
    "frontend/node_modules/**",
    "frontend/dist/**",
    # 内部迁移工具（与 check_public.py 配合；public 不需要它）
    "scripts/migrate_public.py",
    "docs/superpowers/**",
    "docs/session-prompt.md",
    "docs/learning/**",
    "docs/planning/**",
    # Docker 支持文档（2026-10-14）：配套的 Dockerfile/.dockerignore 不在白名单，
    # 且该工作是工作区里尚未提交的进行中改动 —— 待完成并审阅后再放开
    "docs/build/docker.md",
    # 依赖未公开书源的测试（public 无 qidian/qimao/92xs/fanqie-api-*）
    "tests/test_source_async.py",
    "tests/test_source_contracts.py",
    "tests/test_browser_sources.py",
    # 2026-10-14 按 public 侧实跑补齐：public 只保留 fanqie 两个源，以下文件整体失败（59 用例）
    "tests/test_source_layout.py",
    # test_source_oiapi_contract.py 2026-10-14 随 oiapi 源一起进入白名单（该源已公开）
    "tests/test_backend_download_routes.py",
    "tests/test_backend_config_routes.py",
    "tests/test_config_effective_mode.py",
    "tests/test_cli_effective_mode.py",
    "tests/test_source_api.py",
    "tests/test_novel_id_stability.py",
    "tests/test_task_manager_async.py",
    "tests/test_source_names_unique.py",
    "tests/test_delay_default.py",
    # template/** 已纳入白名单：排除含未公开源名的书源配置模板（保留 fanqie 两个）
    "template/config/sources/92xs-requests-default.yaml",
    # fanqie-api-oiapi.yaml 2026-10-14 随 oiapi 源一起进入白名单（其 key 为空占位）
    "template/config/sources/fanqie-api-rain.yaml",
    "template/config/sources/qidian-browser-default.yaml",
    "template/config/sources/qidian-requests-default.yaml",
    "template/config/sources/qimao-api-rain.yaml",
    "template/config/sources/qimao-browser-default.yaml",
    "template/config/sources/qimao-requests-default.yaml",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    # 编译模式书源清单：由 scripts/build_manifest.py 生成，含超长单行
    "novelbase/utils/_manifest.py",
]

[tool.ruff.lint]
# 只启用「真实问题」级别：pycodestyle 错误/语句/语法（E4/E7/E9）、pyflakes（F）、
# 警告（W）、import 排序（I）、bugbear（B）、pyupgrade（UP）。
# 不启用 E501（行长）与 RUF001/002/003（中文全角标点会被判成 ambiguous-unicode）。
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]